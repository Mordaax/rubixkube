apiVersion: v1
kind: Namespace
metadata:
  name: optimizationjob-demo
  labels:
    app.kubernetes.io/part-of: optimizationjob-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-training
  namespace: optimizationjob-demo
---
apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime
metadata:
  name: rubixkube-demo-gpu
  labels:
    app.kubernetes.io/part-of: optimizationjob-demo
spec:
  mlPolicy:
    numNodes: 1
  template:
    spec:
      replicatedJobs:
        - name: node
          replicas: 1
          template:
            metadata:
              labels:
                trainer.kubeflow.org/trainjob-ancestor-step: trainer
            spec:
              parallelism: 1
              completions: 1
              backoffLimit: 0
              template:
                spec:
                  serviceAccountName: demo-training
                  restartPolicy: Never
                  volumes:
                    - name: wsl-drivers
                      hostPath:
                        path: /usr/lib/wsl
                        type: Directory
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 65532
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                    - name: node
                      image: rubixkube-training:cuda
                      imagePullPolicy: Never
                      volumeMounts:
                        - name: wsl-drivers
                          mountPath: /usr/lib/wsl
                          readOnly: true
                      resources:
                        requests:
                          cpu: 100m
                          memory: 96Mi
                          nvidia.com/gpu: "1"
                        limits:
                          cpu: "1"
                          memory: 256Mi
                          nvidia.com/gpu: "1"
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop: ["ALL"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-namespace-boundary
  namespace: optimizationjob-demo
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kubeflow-system
      ports:
        - protocol: TCP
          port: 6789

