apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../kubeflow/trainer/manifests/overlays/manager
images:
  - name: ghcr.io/kubeflow/trainer/trainer-controller-manager
    newName: optimizationjob-demo-manager
    newTag: b12f968
patches:
  - target:
      kind: Deployment
      name: kubeflow-trainer-controller-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --feature-gates=TrainJobStatus=true
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          httpGet:
            path: /healthz
            port: health
          failureThreshold: 60
          periodSeconds: 5
